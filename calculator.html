<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator | Robert Allee</title>
  <link rel="stylesheet" href="styles.css">
  <script src="Assignments/calculator.js" defer></script>
</head>
<body>
  <header>
    <h1>Robert Allee</h1>
    <h3>Web Development Student</h3>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="inspiration.html">Inspirations</a>
      <a href="calculator.html" aria-current="page">Tip Calculator</a>
    </nav>
  </header>

  <main class="calculator">
    <h2>Tip Calculator</h2>
    <p>Enter your bill amount and select your service quality.</p>

    <form id="tip-form">
      <label for="bill-amount">Bill amount ($)</label>
      <input
        type="number"
        id="bill-amount"
        name="billAmount"
        min="0"
        step="0.01"
        placeholder="Example: 45.50"
        required
      >

      <label for="service-quality">Service quality</label>
     
<select id="service-quality" name="serviceQuality">
    <option value="0.25">Excellent (25%)</option>
    <option value="0.20">Good (20%)</option>
    <option value="0.15">Fair (15%)</option>
    <option value="0.10">Poor (10%)</option>
      </select>

      <button type="button" id="calculateButton">Calculate Tip</button>
      <p id="tipResult"></p>
    </form>
  </main>

  <footer>
    <a href="mailto:robertallee@westernwyoming.edu">
      robertallee@westernwyoming.edu
    </a>
  </footer>
  
<script>
document.getElementById("calculateButton").addEventListener("click", function() {
    // Get the bill amount and tip percentage.
    const billAmount = Number(document.getElementById("bill-amount").value);
    const tipPercentage = Number(document.getElementById("service-quality").value);

    // Check for a valid bill amount.
    if (billAmount <= 0) {
        document.getElementById("tipResult").textContent =
            "Please enter a valid bill amount.";
        return;
    }

    // Calculate the tip.
    const tipAmount = billAmount * tipPercentage;

    // Display the result.
    document.getElementById("tipResult").textContent =
        "Your tip amount is: $" + tipAmount.toFixed(2);
});
</script>
</body>
</html>
